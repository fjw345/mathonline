<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title>题库阅读器</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">∑</div>
      <div><strong>题库阅读器</strong><span>本地只读检索</span></div>
    </div>
    <div class="topbar-meta"><span class="status-dot"></span><span>数据源：SQLite · 只读</span></div>
  </header>

  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">QUESTION BANK / REVIEW CONSOLE</p>
        <h1>从题目中快速定位<br><em>需要复核的内容</em></h1>
        <p class="intro-copy">浏览已拆分题目、来源和标签。识别告警单独列出，不会混入题目列表。</p>
      </div>
      <div class="intro-note"><span class="note-icon">i</span><span>这是只读查看器。不会修改题库或原始文件。</span></div>
    </section>

    <section class="metrics" id="metrics" aria-label="题库概览">
      <div class="metric"><span class="metric-label">已收录题目</span><strong id="metric-problems">—</strong><span class="metric-hint">当前数据库</span></div>
      <div class="metric"><span class="metric-label">来源文件</span><strong id="metric-sources">—</strong><span class="metric-hint">已纳入扫描范围</span></div>
      <div class="metric metric-warn"><span class="metric-label">识别告警</span><strong id="metric-issues">—</strong><span class="metric-hint" id="metric-issue-files">— 个文件</span></div>
      <div class="metric"><span class="metric-label">重复别名</span><strong id="metric-aliases">—</strong><span class="metric-hint">已保留来源关系</span></div>
    </section>

    <section class="workspace">
      <aside class="filters" aria-label="筛选条件">
        <div class="section-title"><span>筛选题目</span><button class="text-button" id="reset-filters" type="button">重置</button></div>
        <label class="field-label" for="search">关键词</label>
        <div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索题干、答案、文件名" autocomplete="off"></div>
        <div class="field-group">
          <label class="field-label" for="source-kind">来源类型</label>
          <select id="source-kind"><option value="">全部来源</option></select>
        </div>
        <div class="field-group">
          <label class="field-label" for="year">年份标签</label>
          <select id="year"><option value="">全部年份</option></select>
        </div>
        <div class="field-group">
          <label class="field-label" for="question-type">题型</label>
          <select id="question-type"><option value="">全部题型</option></select>
        </div>
        <div class="filter-row">
          <div class="field-group"><label class="field-label" for="difficulty">难度</label><select id="difficulty"><option value="">全部</option><option value="3">3 · 中等</option><option value="4">4 · 较难</option><option value="5">5 · 困难</option></select></div>
          <div class="field-group"><label class="field-label" for="review">复核状态</label><select id="review"><option value="">全部</option><option value="1">待复核</option><option value="0">已确认</option></select></div>
        </div>
        <div class="filter-footer"><span class="kbd">/</span><span>聚焦搜索</span><span class="kbd">Esc</span><span>清除关键词</span></div>
      </aside>

      <section class="results" aria-label="题目列表">
        <div class="results-head"><div><div class="section-title"><span>题目列表</span><span class="count-badge" id="result-count">—</span></div><p class="results-subtitle" id="result-summary">正在读取题库…</p></div><button class="outline-button" id="show-issues" type="button"><span aria-hidden="true">!</span> 查看识别告警</button></div>
        <div class="list-head"><span>题目</span><span>来源与位置</span><span>状态</span></div>
        <div id="problem-list" class="problem-list" aria-live="polite"></div>
        <div class="empty-state hidden" id="empty-state"><div class="empty-icon">⌕</div><h2>没有匹配的题目</h2><p>调整关键词或筛选条件后再试。</p></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="modal-backdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" type="button" aria-label="关闭详情">×</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <script src="/static/app.js" defer></script>
</body>
</html>
